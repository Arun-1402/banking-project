server:
  port: 8888
spring:
  application:
    name: config-server
  security:
    user:
      name: user_name
      password: password
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Arun-1402/banking-config-repo
          default-label: main
          clone-on-start: true
          timeout: 10
management:
  endpoints:
    web:
      exposure:
        include:
        - health
        - info
        - metrics