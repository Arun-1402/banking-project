server:
  port: 9000
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres-auth:5432/authdb
    username: username
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: false
  flyway:
    enabled: true
    locations: classpath:/db/migration
  data:
    redis:
      host: redis
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: abc@gmail.com
    password: account_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
twilio:
  sid: add_sid
  token: add_token
  number: add_num
eureka:
  client:
    service-url:
      defaultzone: http://eureka-server:8761/eureka
logging:
  level:
    '[org.springframework.security]': debug